[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-samplecheck"
version = "1.0.0"
description = "Measure how VEC local metrics change as prediction cell count changes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "anndata>=0.10",
  "veckit>=0.1.1"
]
keywords = ["virtual-embryo", "veckit", "cell-count", "benchmarking"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vec-samplecheck = "vec_samplecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
